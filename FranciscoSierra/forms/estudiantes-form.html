<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/forms-styles.css" />
    <title>Formulario de Estudiantes</title>
  </head>

  <body id="editar">
    <header class="form-header">
      <h1>Sistema de Gestión</h1>
    </header>
    <div class="Contenedor">
      <a href="../pages/estudiantes.html" class="cerrar">✖</a>
        <h2 class="Titulo-formulario titulo-nuevo">Nuevo Estudiante</h2>
        <h2 class="Titulo-formulario titulo-editar">Modificar Estudiante</h2>
      <form class="Formulario" action="../pages/estudiantes.html">
        <div class="Contenedor-formulario">
          <div class="Division-formulario">
            <label for="nombre">Nombre:</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Nombre"
              required
            />
          </div>
          <div class="Division-formulario">
            <label for="apellido">Apellido:</label>
            <input
              type="text"
              id="apellido"
              name="apellido"
              placeholder="Apellido"
              required
            />
          </div>
          <div class="Division-formulario">
            <label for="correo">Correo:</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="Correo electronico"
              required
            />
          </div>
          <div class="Division-formulario">
            <label for="celular">Celular:</label>
            <input
              type="tel"
              id="celular"
              name="celular"
              placeholder="Celular"
              required
              pattern="[0-9]{10}"
              title="Debe tener 10 dígitos"
            />
          </div>
        </div>
        <div class="Botones">
          <button type="submit" class="btn-guardar">Guardar</button>
          <a href="../pages/estudiantes.html" class="btn-cancelar">Cancelar</a>
        </div>
      </form>
    </div>
    <footer class="form-footer">
      <p>Francisco Javier Sierra Restrepo</p>
      <p>fjsierrare@cesde.net</p>
    </footer>
  </body>
</html>
