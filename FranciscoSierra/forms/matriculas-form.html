<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/forms-styles.css" />
    <title>Formulario de Matriculas</title>
  </head>

  <body>
    <header class="form-header">
      <h1>Sistema de Gestión</h1>
    </header>
    <div class="Contenedor">
      <a href="../pages/matriculas.html" class="cerrar">✖</a>
      <h2 class="Titulo-formulario">Nueva matricula</h2>
      <form class="Formulario" action="../pages/matriculas.html">
        <div class="Contenedor-formulario">
          <div class="Division-formulario">
            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
              <option value="" selected disabled>Seleccione un curso</option>
              <option value="ING1">Inglés nivel 1</option>
              <option value="AFIN3">Administración Financiera nivel 3</option>
            </select>
          </div>
          <div class="Division-formulario">
            <label for="estudiante">Estudiante:</label>
            <select id="estudiante" name="estudiante" required>
              <option value="" selected disabled>
                Seleccione un estudiante
              </option>
              <option value="1">Francisco Javier Sierra Restrepo</option>
              <option value="2">Carmen Maritza Restrepo Sanchez</option>
              <option value="3">Juan Felipe Ramirez Botero</option>
            </select>
          </div>
          <div class="Division-formulario">
            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
              <option value="ACTIVA" selected>Activa</option>
              <option value="COMPLETADA">Completada</option>
              <option value="CANCELADA">Cancelada</option>
            </select>
          </div>
          <div class="Division-formulario">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required />
          </div>
        </div>
        <div class="Botones">
          <button type="submit" class="btn-guardar">Guardar</button>
          <a href="../pages/matriculas.html" class="btn-cancelar">Cancelar</a>
        </div>
      </form>
    </div>
    <footer class="form-footer">
      <p>Francisco Javier Sierra Restrepo</p>
      <p>fjsierrare@cesde.net</p>
    </footer>
  </body>
</html>
