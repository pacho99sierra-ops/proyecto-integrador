<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/forms-styles.css" />
    <title>Formulario de Cursos</title>
  </head>

  <body>
    <header class="form-header">
      <h1>Sistema de Gestión</h1>
    </header>
    <div class="Contenedor">
      <a href="../pages/cursos.html" class="cerrar">✖</a>
      <h2 class="Titulo-formulario">Nuevo curso</h2>
      <form class="Formulario" action="../pages/cursos.html">
        <div class="Contenedor-formulario">
          <div class="Division-formulario">
            <label for="codigo">Código:</label>
            <input
              type="text"
              id="codigo"
              name="codigo"
              placeholder="Ej: ING1"
              required
              pattern="[A-Z0-9]{3,6}"
              title="De 3 a 6 caracteres, mayúsculas y números"
            />
          </div>
            <div class="Division-formulario">
                <label for="nombre">Nombre del curso:</label>
                <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Nombre del curso"
                required
                />
            </div>
          <div class="Division-formulario">
            <label for="descripcion">Descripción:</label>
            <textarea
              id="descripcion"
              name="descripcion"
              rows="4"
              placeholder="Descripción del curso"
            ></textarea>
          </div>
          <div class="Division-formulario">
            <label for="capacidad">Capacidad:</label>
            <input
              type="number"
              id="capacidad"
              name="capacidad"
              placeholder="Máx. estudiantes"
              required
              min="1"
              max="50"
            />
          </div>
        </div>
        <div class="Botones">
          <button type="submit" class="btn-guardar">Guardar</button>
          <a href="../pages/cursos.html" class="btn-cancelar">Cancelar</a>
        </div>
      </form>
    </div>
    <footer class="form-footer">
      <p>Francisco Javier Sierra Restrepo</p>
      <p>fjsierrare@cesde.net</p>
    </footer>
  </body>
</html>
